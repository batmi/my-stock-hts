# 자동 검사 — 빠른 핵심 검사(매 푸시·PR)와 전체 회귀 검사(정해진 시각·수동 실행)를 나눈다.
#
#  · 핵심 검사: tools/core_checks.py 의 목록(판단·주문·설정 불변식과 재발 방지 가드).
#    시각·장 상태에 기대지 않고 네트워크 없이 돈다 — CI 신호로 쓸 수 있는 것만 담았다.
#  · 전체 회귀: `python -m pytest` 전체. 매일 KST 03:00(장 밖)과 평일 KST 10:30(장중)에 돈다.
#    [2026-10-24] 종전엔 '요일·시각에 따라 갈리는 테스트가 있어' 수동 실행만 두었는데, 벽시계에 물리던
#    세 구간은 2026-09-20 에 모두 해소됐고(conftest 자동 고정 2개 + order_age_seconds) 수동 실행은 한 번도
#    돌지 않았다. 장중 실행은 시각 의존이 다시 생겼는지 드러내는 대조다 — 03:00 만 깨지거나 10:30 만
#    깨지면 코드가 아니라 실행 시각을 먼저 의심한다.
#  · 파이썬 판: 최저 지원판(3.12) · 운영 라즈베리파이(3.13) · 개발기(3.14).
#    [2026-10-24] 최저 판 3.10 → 3.12. 3.12 이상은 하한만 걸린 requirements 로 pandas 3.x 를 받는데,
#    운영 파이와 개발기 venv 는 pandas 2.3.3 이다 — 그래서 '운영 파이와 같은 조합'을 판 고정(pins)으로
#    따로 둔다(파이 실측 10-24: Python 3.13 · pandas 2.3.3 · numpy 2.2.4). 파이 판이 바뀌면 여기도 바꾼다:
#      python3 -c "import pandas, numpy; print(pandas.__version__, numpy.__version__)"
#    나머지 두 판은 '지금 새로 설치하면 받는 최신'(pandas 3)을 본다.
#  · 실계좌·외부 서비스 호출 없음: tests/conftest.py 가 네트워크 호스트와 운영 파일을 막는다.
name: checks

on:
  push:
  pull_request:
  schedule:
    - cron: "0 18 * * *"        # 매일 KST 03:00
    - cron: "30 1 * * 1-5"      # 평일 KST 10:30 (장중)
  workflow_dispatch:
    inputs:
      full:
        description: "전체 회귀 검사도 돌린다"
        type: boolean
        default: false

jobs:
  core:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"     # 최저 지원판 — 새로 설치하면 받는 최신 의존성(pandas 3)
            pins: ""
          - python: "3.13"     # 운영 라즈베리파이와 같은 조합
            pins: "pandas==2.3.3 numpy==2.2.4"
          - python: "3.14"     # 개발기 판 — 새로 설치하면 받는 최신 의존성(pandas 3)
            pins: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: 의존성 설치
        run: python -m pip install -r requirements-dev.txt ${{ matrix.pins }}
      - name: 설치된 판
        run: python -c "import sys, pandas, numpy; print(sys.version.split()[0], 'pandas', pandas.__version__, 'numpy', numpy.__version__)"
      - name: 핵심 검사
        env:
          TZ: Asia/Seoul
          HTS_NO_RUN_MANIFEST: "1"
        run: python tools/core_checks.py -q

  full:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"      # 운영 라즈베리파이와 같은 판
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: 의존성 설치
        #  전체 회귀는 운영 파이와 같은 조합으로 돈다(core 매트릭스의 3.13 항목과 같은 판 고정)
        run: python -m pip install -r requirements-dev.txt pandas==2.3.3 numpy==2.2.4
      - name: 설치된 판
        run: python -c "import sys, pandas, numpy; print(sys.version.split()[0], 'pandas', pandas.__version__, 'numpy', numpy.__version__)"
      - name: 전체 회귀 검사
        env:
          TZ: Asia/Seoul
          HTS_NO_RUN_MANIFEST: "1"
        run: python -m pytest -q -rfE
