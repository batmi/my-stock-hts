[pytest]
#timeout = 180
addopts = -n auto
markers =
    real_index_chart: get_domestic_index_chart 자체 로직을 검증하므로 지수 조회 자동 mock을 비활성화한다.
    real_balance_api: 잔고 조회 API 자체를 검증하므로 잔고 엔드포인트 자동 mock을 비활성화한다.
    real_yfinance: fetch_yfinance_data 자체의 로직을 검증하므로 yfinance 자동 차단을 비활성화한다.
    paper_session_gate: 가상투자 체결의 시장 열림/ETF 창 게이트 자체를 검증하므로 자동 고정을 비활성화한다.
    real_session_window: KRX 휴게(15:30~16:00) 판정 자체를 검증하므로 domestic_break_window 자동 고정을 비활성화한다.
filterwarnings =
    ignore::DeprecationWarning
    ignore::urllib3.exceptions.InsecureRequestWarning
    ignore::ResourceWarning
    ignore:unclosed database:ResourceWarning
    ignore:.*ipywidgets.*:UserWarning
    ignore:.*include is ignored.*
