[pytest]
#timeout = 180
addopts = -n auto
markers =
    real_index_chart: get_domestic_index_chart 자체 로직을 검증하므로 지수 조회 자동 mock을 비활성화한다.
    real_balance_api: 잔고 조회 API 자체를 검증하므로 잔고 엔드포인트 자동 mock을 비활성화한다.
filterwarnings =
    ignore::DeprecationWarning
    ignore::urllib3.exceptions.InsecureRequestWarning
    ignore::ResourceWarning
    ignore:unclosed database:ResourceWarning
    ignore:.*ipywidgets.*:UserWarning
    ignore:.*include is ignored.*
